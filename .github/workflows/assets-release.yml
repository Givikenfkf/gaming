name: Publish Release for Assets

on:
  push:
    paths:
      - 'Minecraft.Assets/**'
      - '.github/workflows/assets-release.yml'
  pull_request:
    paths:
      - 'Minecraft.Assets/**'
      - '.github/workflows/assets-release.yml'

jobs:
  assets-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip python3-setuptools libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev libpng-dev pkg-config

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/assets-release.yml') }}

      - name: Install Meson and Ninja (pip)
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Restore meson cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/meson
          key: ${{ runner.os }}-meson-${{ hashFiles('**/meson.build') }}

      - name: Configure Meson
        run: meson setup build_assets --wipe --buildtype=release

      - name: Build the assets
        run: meson compile -C build_assets -j $(nproc) -v Minecraft.Assets_Localisation Minecraft.Assets_Colour_Table Minecraft.Media_Archive

      - name: Copy/package the final assets
        run: |
          python3 scripts/copy_assets_to_client.py "$PWD" build_assets build_assets/Minecraft.Client build_assets/Minecraft.Assets/MediaLinux.arc frog.stamp
          tar cfz Minecraft.Assets.tar.gz build_assets/Minecraft.Client/*

      - name: Publish a release for the assets
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Assets Release
          tag_name: latest-assets
          target_commitish: ${{ github.sha }}
          body: This is an assets release for commit ${{ github.sha }}
          files: Minecraft.Assets.tar.gz
          fail_on_unmatched_files: true
