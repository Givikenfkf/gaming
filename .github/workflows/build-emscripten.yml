name: Build (Emscripten 64-bit)

on:
  push:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**.cc'
      - '**.cxx'
      - '**.hh'
      - '**.hpp'
      - '**.hxx'
      - '**.inl'
      - '**.frag'
      - '**.vert'
      - '**/meson.build'
      - 'subprojects/*.wrap'
      - '.github/workflows/build-emscripten.yml'

  pull_request:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**.cc'
      - '**.cxx'
      - '**.hh'
      - '**.hpp'
      - '**.hxx'
      - '**.inl'
      - '**.frag'
      - '**.vert'
      - '**/meson.build'
      - 'subprojects/*.wrap'
      - '.github/workflows/build-emscripten.yml'

  workflow_dispatch:

jobs:
  build-emscripten:
    runs-on: ubuntu-latest

    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ccache ninja-build python3-pip
          python3 -m pip install meson --break-system-packages

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: emscripten-ccache-${{ hashFiles('**/meson.build') }}
          restore-keys: |
            emscripten-ccache-

      - name: Configure Meson
        run: |
          meson setup build_emscripten \
            --cross-file scripts/emscripten_native.txt \
            -Dui_backend=java \
            -Drenderer=gles

      - name: Build
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          meson compile -C build_emscripten -j $(nproc)

      - name: List build output
        run: |
          find build_emscripten/Minecraft.Client -type f | sort

      - name: Upload Emscripten build
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-emscripten-${{ github.sha }}
          path: |
            build_emscripten/Minecraft.Client/**
          retention-days: 7
